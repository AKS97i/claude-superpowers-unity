name: Validate Superpowers

# Structural validation so human reviewers can focus on the quality of the
# reasoning encoded. The checks live in scripts/validate.py so they run
# identically locally (`python scripts/validate.py`) and in CI.
# See docs/testing-superpowers.md (layer 4).

on:
  pull_request:
    paths:
      - "superpowers/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "superpowers/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"

jobs:
  structure:
    name: Structure, frontmatter, evals & triggers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Superpowers
        run: python scripts/validate.py
